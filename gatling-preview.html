<!doctype html>
<!-- 加特林品质样板使用正式绘制器与独立内存进度，不读取玩家存档。 -->
<html lang="zh-CN"><head>
<link rel="preload" href="/assets/fonts/HYQiHei_75S.ttf" as="font" type="font/ttf" crossorigin><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n-text="art.gatling.title"></title>
<link rel="stylesheet" href="/src/styles/fonts.css">
<style>
body{margin:20px;background:#edf0df;color:#3b5742;font:16px var(--game-font-family)}h1{font-size:25px}p{max-width:900px;line-height:1.7}.models{display:flex;gap:12px;flex-wrap:wrap}figure{margin:0;padding:12px;border-radius:14px;background:#dce3c8}figcaption{font-weight:600}canvas{width:340px;max-width:100%;height:auto}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,select{font:inherit;padding:10px;border:1px solid #78916c;border-radius:8px;background:#fff8df;color:inherit}#viewport{overflow:auto}iframe{display:block;width:390px;height:min(844px,calc(100vh - 110px));border:1px solid #78916c}pre{font-family:var(--game-font-family);white-space:pre-wrap;font-size:12px}details{margin:16px 0}
</style></head><body>
<h1 data-i18n-text="art.gatling.title"></h1><p data-i18n-text="art.gatling.intro"></p>
<section class="models"><figure><figcaption data-i18n-text="art.gatling.base"></figcaption><canvas id="base" width="720" height="320" data-i18n-aria-label="art.gatling.base"></canvas></figure><figure><figcaption data-i18n-text="art.gatling.middle"></figcaption><canvas id="middle" width="720" height="320" data-i18n-aria-label="art.gatling.middle"></canvas></figure><figure><figcaption data-i18n-text="art.gatling.upgraded"></figcaption><canvas id="upgraded" width="720" height="320" data-i18n-aria-label="art.gatling.upgraded"></canvas></figure></section>
<nav><label><span data-i18n-text="art.gatling.stage"></span> <select id="stage"><option value="base" data-i18n-text="art.gatling.base"></option><option value="middle" data-i18n-text="art.gatling.middle"></option><option value="upgraded" data-i18n-text="art.gatling.upgraded"></option></select></label><label><span data-i18n-text="art.gatling.width"></span> <select id="size"><option>390</option><option>320</option><option>1280</option></select></label>
<button data-command="hand" data-i18n-text="art.gatling.hand"></button><button data-command="tank" data-i18n-text="art.gatling.tank"></button><button data-command="night" data-i18n-text="art.gatling.night"></button><button data-command="fire" data-i18n-text="art.gatling.fire"></button><button data-command="turn" data-i18n-text="art.gatling.turn"></button><button data-command="pause" data-i18n-text="art.gatling.pause"></button><button data-command="workshop" data-i18n-text="art.gatling.workshop"></button><button data-command="drive" data-i18n-text="art.gatling.drive"></button></nav>
<div id="viewport"><iframe id="scene" data-i18n-title="art.gatling.scene"></iframe></div>
<details><summary data-i18n-text="art.gatling.debug"></summary><button data-command="checks" data-i18n-text="art.gatling.checks"></button><button data-command="record" data-i18n-text="art.gatling.record"></button><pre id="report" role="status"></pre></details>
<script type="module" src="/src/art/gatling-preview.js"></script></body></html>
